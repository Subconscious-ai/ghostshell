name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Lint with ruff
        run: >-
          ruff check
          server/
          api/
          scripts/export_mcp_manifest.py
          scripts/smoke_stdio_mcp.py
          tests/
        
      - name: Type check with mypy
        run: mypy server/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Run tests
        run: pytest tests/ -v
        env:
          AUTH0_JWT_TOKEN: "test_token"
          API_BASE_URL: "https://api.dev.subconscious.ai"

  validate-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          
      - name: Export public MCP tool manifest
        run: python scripts/export_mcp_manifest.py

      - name: Verify committed manifest is current
        run: |
          git diff --exit-code mcp-tools.public.json || {
            echo "::error::MCP manifest is stale. Run 'python scripts/export_mcp_manifest.py' and commit the result."
            exit 1
          }

      - name: Validate MCP stdio protocol
        run: python scripts/smoke_stdio_mcp.py
        env:
          AUTH0_JWT_TOKEN: "test_token"
          API_BASE_URL: "https://api.dev.subconscious.ai"

      - name: Publish public MCP contract
        uses: actions/upload-artifact@v4
        with:
          name: public-mcp-tools-${{ github.sha }}
          path: mcp-tools.public.json
